<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272e3b">
<title>Settings – EDP Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body style="padding-bottom:30px">
<header class="app">
  <a class="icon" href="index.html" data-i18n-title="back">←</a>
  <img class="logo" src="assets/edp-logo.jpg" alt="EDP">
  <div class="titles"><strong data-i18n="setTitle">Settings</strong><small id="saveStatus"></small></div>
  <div id="langSwitch" class="lang-switch"></div>
</header>
<main>
  <div class="report-head"><div><p class="eyebrow">ADMIN</p><h1 data-i18n="setTitle">Settings</h1></div></div>
  <div id="noAccess" class="card hidden"><p data-i18n="setNoAccess"></p></div>
  <div id="settings" class="hidden">
    <section class="card">
      <h2 data-i18n="setUsers">Users and rights</h2>
      <p class="muted small" data-i18n="setUsersIntro"></p>
      <p class="muted small" id="targetIntro"></p>
      <input id="search" type="search" data-i18n-ph="setSearch" style="margin:12px 0 4px">
      <div id="userList"></div>
    </section>
    <section class="card">
      <h2 data-i18n="setInvite">Give rights in advance</h2>
      <p class="muted small" id="inviteIntro"></p>
      <form id="inviteForm" class="invite-form">
        <input id="inviteEmail" type="email" placeholder="naam@edp.com" autocomplete="off" required>
        <select id="inviteRole"></select>
        <button class="primary" type="submit" data-i18n="setInviteBtn">Add</button>
      </form>
      <h3 data-i18n="setInviteList">Waiting for account</h3>
      <div id="inviteList"></div>
    </section>
  </div>
</main>
<div id="toast"></div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="settings.js"></script>
</body>
</html>
