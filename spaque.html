<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272e3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SPAQUE – EDP Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app">
  <a class="icon" href="index.html" data-i18n-title="back">←</a>
  <img class="logo" src="assets/edp-logo.jpg" alt="EDP">
  <div class="titles"><strong>SPAQUE</strong><small id="saveStatus" data-i18n="ready">Ready</small></div>
  <div id="langSwitch" class="lang-switch"></div>
  <button id="installBtn" class="icon" data-i18n-title="install">↓</button>
</header>

<main>
  <nav class="tabs">
    <button class="tab active" data-tab="info" data-i18n="tabInfo">Info</button>
    <button class="tab" data-tab="parts" data-i18n="tabParts">Onderdelen</button>
    <button class="tab" data-tab="checklist" data-i18n="tabChecklist">Checklist</button>
    <button class="tab" data-tab="photos" data-i18n="tabPhotos">Foto-overzicht</button>
    <button class="tab" data-tab="finish" data-i18n="tabFinish">Afronden</button>
  </nav>

  <section id="info" class="panel active">
    <div class="card">
      <h2 data-i18n="spInfoTitle">Inspectiegegevens</h2>
      <div class="iso"><strong data-i18n="spNorm">Toepasselijke norm:</strong> ISO 2859-1 · General Level II sampling</div>
      <div id="infoFields" class="grid" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2 data-i18n="spTechRef">Technische referentie</h2>
      <img class="refimg" src="assets/tech-ref.jpg" data-i18n-alt="spTechRefAlt" alt="">
    </div>
  </section>

  <section id="parts" class="panel">
    <div class="card"><h2 data-i18n="tabParts">Onderdelen</h2><p class="muted" data-i18n="spPartsIntro"></p><div id="partGroups"></div></div>
  </section>

  <section id="checklist" class="panel">
    <div class="card">
      <div class="editbar"><button class="btn secondary compact" id="editToggle" data-i18n="spEditFields">✎ Rijen bewerken</button><button class="btn compact" id="addCheck" data-i18n="spAddRow">+ Rij toevoegen</button></div>
      <h2 data-i18n="spChecklistTitle">Inspection checklist</h2>
      <div id="checkList"></div>
    </div>
  </section>

  <section id="photos" class="panel">
    <div class="card">
      <h2 data-i18n="spPhotoOverview">Foto-overzicht</h2>
      <p class="muted" data-i18n="spPhotoOverviewIntro"></p>
      <div class="photo-actions"><label class="btn"><span data-i18n="spExtraPhoto">+ Extra foto</span><input id="extraPhoto" type="file" accept="image/*" multiple hidden></label></div>
      <div id="photoOverview" class="overview"></div>
    </div>
  </section>

  <section id="finish" class="panel">
    <div class="card"><h2 data-i18n="spObservations">Vaststellingen en opmerkingen</h2><textarea id="observations" rows="6" data-i18n-ph="spObservationsPh"></textarea></div>
    <div class="card"><h2 data-i18n="completion">Afronding</h2><p class="muted" data-i18n="spFinishText"></p></div>
    <div class="privacy"><strong data-i18n="privacyTitle">Privé</strong><span data-i18n="privacyText"></span></div>
  </section>
  <p class="footer">EDP Reports v4.0 · SPAQUE</p>
</main>

<div class="actions">
  <button class="secondary" id="resetBtn" data-i18n="newReport">Nieuw</button>
  <button class="secondary" id="pdfBtn" data-i18n="downloadPdf">PDF downloaden</button>
  <button class="primary" id="shareBtn" data-i18n="sendPdf">PDF versturen ↗</button>
</div>
<div id="toast"></div>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="pdf-engine.js"></script>
<script src="spaque.js"></script>
</body>
</html>
